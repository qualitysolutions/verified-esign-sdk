[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qls-verified-esign"
version = "2026.10.21"
description = "Python SDK for the Verified (verified.eu) eSign API: envelopes, documents, recipients, signing."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "QLS quality solutions AB" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
]

[project.urls]
Repository = "https://github.com/qualitysolutions/verified-esign-sdk"
Changelog = "https://github.com/qualitysolutions/verified-esign-sdk/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# SNS signature verification for webhook receivers.
webhooks = [
    "cryptography>=42",
]
dev = [
    "cryptography>=42",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/verified_esign"]

[tool.hatch.build.targets.sdist]
exclude = [".env", ".venv", "dist"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests hit the live API and require VERIFIED_* credentials; excluded by
# default. Run them with:  pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: live API tests requiring VERIFIED_* credentials (skipped by default)",
]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
# Type-check model constructors (field types, enums, unknown fields) for SDK callers.
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true
