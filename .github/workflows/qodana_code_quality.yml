name: Qodana
on:
  workflow_dispatch:
  # Gate on PRs to main only (minutes-thrifty - push-to-branch scans are
  # intentionally off). After merging a cleanup run
  # `gh workflow run qodana_code_quality.yml --ref main` to refresh the
  # Qodana Cloud dashboard, which defaults to the main branch.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  qodana:
    # Dependabot runs get no Actions secrets; the job is skipped for them,
    # which a required check treats as passed (HP-46, same as group A).
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # No skip when the token is missing: the scan must fail closed, so a
      # required `qodana` check can never pass without an analysis.
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@aa698739cd4b8204ad53291bea7e16cd75da3c9f # v2026.3.1
        with:
          pr-mode: false
          # CI-generated baseline: findings that existed when the check was
          # introduced are accepted; only NEW problems fail (failThreshold: 0).
          args: --baseline,qodana.sarif.json
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
